[project]
name = "otrs-exporter"
version = "0.2.2"
description = "This OTRS prometheus exporter aims to provide application performance metrics and (to some degree) usage statistics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mysql-connector-python==9.5.0",
    "prometheus-client==0.24.1",
    "pygtail==0.14.0",
    "requests==2.32.5",
    "systemd==0.17.1; sys_platform == 'linux'",
]
