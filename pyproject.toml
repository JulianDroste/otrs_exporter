[project]
name = "otrs-exporter"
version = "0.2.1"
description = "This OTRS prometheus exporter aims to provide application performance metrics and (to some degree) usage statistics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mysql-connector-python==9.1.0",
    "prometheus-client==0.9.0",
    "pygtail==0.11.1",
    "requests==2.32.5",
    "systemd==0.16.1; sys_platform == 'linux'",
]
